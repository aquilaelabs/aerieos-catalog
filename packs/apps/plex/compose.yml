services:
  plex:
    image: plexinc/pms-docker:1.41.6.9685-d301f511a
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PLEX_UID: ${PUID}
      PLEX_GID: ${PGID}
      PLEX_CLAIM: ${CLAIM}
    ports:
      - "${PORT}:32400"
    volumes:
      - ${DATA}/config:/config
      - ${DATA}/transcode:/transcode
      - ${MEDIA}:/data:ro
