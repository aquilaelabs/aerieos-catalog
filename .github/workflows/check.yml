# The vetting check (R169 step 3): a pull request's changed entries fetched
# at their pins and held to AerieOS's own validators, as every release still
# supported carries them (aerieos-releases): an entry passes when the oldest
# install that reads its pack format takes it as the newest does. A push to
# main checks every entry and the maintainers' signature over the index.
# Either way the check says whose each changed entry is and refuses a change
# that crosses owners (catalog-check.py's whose): Aerie's own entries and a
# third party's are never moved by one change.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: the check's own rules
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      # By the copy of the check main has, not the pull request's own: a
      # change cannot loosen the rule it is held to.
      - name: whose each changed entry is, by the rules main holds
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          held="${RUNNER_TEMP}/held"
          mkdir -p "${held}"
          for f in catalog-check.py catalog-sign.py; do
            git show "origin/${BASE}:tools/${f}" > "${held}/${f}"
          done
          # A pull request from a fork comes from outside: it never moves
          # one of Aerie's entries or changes a file that was here.
          outside=()
          if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then outside=(--outside); fi
          if grep -q -- '--whose-from' "${held}/catalog-check.py"; then
            CATALOG_ROOT="${PWD}" python3 "${held}/catalog-check.py" --whose-from "origin/${BASE}" "${outside[@]}"
          else
            echo "main's check does not say whose an entry is yet: this pull request's own does, in the next step"
          fi
      - name: the entries a pull request changes, on every AerieOS release still supported
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(tools/aerieos-checkouts.sh)
          python3 tools/catalog-check.py "${releases[@]}" --changed-from "origin/${BASE}"
      - name: every entry on every AerieOS release still supported, and the signature
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(tools/aerieos-checkouts.sh)
          # Whose each entry is that this push moved: one that came by a
          # pull request was held to it there, and one pushed straight to
          # main is held to it here.
          whose=()
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then whose=(--whose-from "${BEFORE}"); fi
          python3 tools/catalog-check.py "${releases[@]}" --signed "${whose[@]}"
