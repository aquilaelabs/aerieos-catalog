# The index signed by the maintainers' key, which lives only in this
# repository's secret CATALOG_SIGNING_KEY: run by hand on the branch that
# holds a changed index.json. Every entry is fetched at its pin and held to
# AerieOS's own validators first, the signature is checked against the
# public half this repository carries (catalog.pub), and index.sig is
# committed to the branch it ran on. main is never written here: a maintainer
# merges the branch once it is signed.
#
# Every entry is held to each AerieOS release still supported
# (aerieos-releases). aerieos_ref names one more branch or tag to hold them
# to, for an index that pins an entry written in a pack format no release
# reads yet: signed on a branch, an install running that AerieOS can be
# pointed at the branch to try it. main's own check names the releases
# alone, so such an index is merged once a release that reads the format is
# out and listed.
name: sign
on:
  workflow_dispatch:
    inputs:
      aerieos_ref:
        description: One more AerieOS branch or tag to hold the entries to, beside the releases listed
        required: false
        default: ""
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - name: Not on main
        if: github.ref_name == 'main'
        run: |
          echo "run this on the branch that holds the changed index, then merge it: main only ever takes a signed index"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Every entry, as each AerieOS release still supported would take it
        env:
          AERIEOS_REF: ${{ inputs.aerieos_ref }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(tools/aerieos-checkouts.sh "${AERIEOS_REF}")
          python3 tools/catalog-check.py "${releases[@]}"
      - name: Sign the index
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_SIGNING_KEY}" ]; then
            echo "this repository has no secret CATALOG_SIGNING_KEY: nothing is signed"
            exit 1
          fi
          key="${RUNNER_TEMP}/catalog.key"
          # The secret is the key file's one line, or the hex alone, which is
          # what is left when only the second word was pasted.
          case "${CATALOG_SIGNING_KEY}" in
            builderbot-catalog-ed25519-private*) line="${CATALOG_SIGNING_KEY}" ;;
            *) line="builderbot-catalog-ed25519-private $(printf '%s' "${CATALOG_SIGNING_KEY}" | tr -d '[:space:]')" ;;
          esac
          ( umask 077; printf '%s\n' "${line}" > "${key}" )
          python3 tools/catalog-sign.py sign "${key}"
          rm -f "${key}"
          # The secret is the key this repository names, or nothing is kept.
          python3 tools/catalog-sign.py verify catalog.pub
      - name: Commit the signature to this branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.sig; then
            echo "index.sig is already this index's signature"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.sig
          git commit -m "The index signed by the maintainers' key (the sign workflow, run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${BRANCH}"
