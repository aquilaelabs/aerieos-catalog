# The index signed by the maintainers' key, which lives only in the secret
# CATALOG_SIGNING_KEY of this repository's environment `sign`: run by hand
# for the branch that holds a changed index.json. Every entry is fetched at
# its pin and held to AerieOS's own validators first, the index is stamped
# with the moment and signed, the signature is checked against the public
# half main carries (catalog.pub), and index.json and index.sig are
# committed to the branch that was signed. main is never written here: a
# maintainer merges the branch once it is signed.
#
# What is handed the key is main's, never the branch's. Run from main, with
# `branch` naming the branch to sign, the workflow itself and every program
# it runs (tools/catalog-check.py, tools/catalog-sign.py, the pinned
# library in tools/sign-requirements.txt, catalog.pub) are the copies main
# has, and the branch is read as data: its index, its packs. The environment
# `sign` is what holds a run to that: limited to main in this repository's
# settings, with a maintainer as its required reviewer, a run started from
# any other branch is given no key, and the run ends at its first step.
#
# The job that reads the key runs nothing of a third party's and nothing of
# the branch's. The entries are read in a job that holds no secret (check),
# a third party's pack is installed in another (installs), and the signing
# job signs the very commit those two answered for.
#
# There is no other way in. A main whose tools cannot do this (no pinned
# list of the library, no tool that reads another tree) signs nothing: the
# run says what main lacks and ends, and never falls back to the branch's
# copy of anything. So the tools and the workflows are on main before the
# first index is signed with them (README, For the maintainers). Every
# action is named by its full commit, and the one library is installed from
# main's list with each file held to its sha256.
#
# Every entry is held to each AerieOS release the catalog serves
# (aerieos-releases, the branch's own: listing a release is part of what is
# signed). aerieos_ref names one more branch or tag to hold them to, for an
# index that pins an entry written in a pack format no release reads yet:
# signed on a branch, an install running that AerieOS can be pointed at the
# branch to try it. main's own check names the releases alone, so such an
# index is merged once a release that reads the format is out and listed.
# With no release listed and no aerieos_ref the run fails and says so; and
# an index whose formats does not say which AerieOS first reads a pack
# format it uses is not signed (tools/aerieos-release.py TAG writes it).
name: sign
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch whose index is signed
        required: true
      aerieos_ref:
        description: One more AerieOS branch or tag to hold the entries to, beside the releases listed
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: sign-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      branch: ${{ steps.which.outputs.branch }}
    steps:
      - name: Run from main, for a branch that is not main
        id: which
        env:
          ASKED: ${{ inputs.branch }}
          RAN_FROM: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${RAN_FROM}" != refs/heads/main ]; then
            echo "run this workflow from main, with the branch to sign named: what is handed the key is main's copy of it, and a run from ${RAN_FROM} is given none"
            exit 1
          fi
          branch="${ASKED}"
          if ! printf '%s' "${branch}" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$'; then
            echo "not a branch's name: ${branch}"
            exit 1
          fi
          if [ "${branch}" = main ]; then
            echo "name the branch that holds the changed index, then merge it once it is signed: main only ever takes a signed index"
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
      # The branch, as data: its index and its packs, with the whole history
      # the check reads whose each entry is from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: ${{ steps.which.outputs.branch }}
          fetch-depth: 0
          path: branch
          persist-credentials: false
      # main's copy of the programs that check and sign.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: main
          path: held
          persist-credentials: false
      - name: The commit that is checked is the one that is signed
        id: commit
        run: echo "commit=$(git -C branch rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: main's tools are the ones that check and sign, or nothing is signed
        run: |
          set -euo pipefail
          # No copy of the branch's stands in for one main lacks.
          lacks=()
          for f in catalog-check.py catalog-sign.py offline-install.py aerieos-checkouts.sh sign-requirements.txt; do
            [ -f "held/tools/${f}" ] || lacks+=("tools/${f}")
          done
          grep -q 'CATALOG_ROOT' held/tools/catalog-sign.py 2>/dev/null || lacks+=("a tools/catalog-sign.py that signs another tree (CATALOG_ROOT)")
          grep -q -- '--installs-only' held/tools/catalog-check.py 2>/dev/null || lacks+=("a tools/catalog-check.py that installs apart from reading (--installs-only)")
          if [ "${#lacks[@]}" != 0 ]; then
            printf 'main lacks %s\n' "${lacks[@]}"
            echo "the key is handed to main's tools alone: land the tools and the workflows on main first (README, For the maintainers), then run this again"
            exit 1
          fi
      - name: Every entry, as each AerieOS release still supported would take it
        env:
          AERIEOS_REF: ${{ inputs.aerieos_ref }}
        run: |
          set -euo pipefail
          # The releases the branch lists, with the checkouts made by main's
          # copy of the script, into a file first: a release that cannot be
          # fetched, or none listed and none named, ends the run here.
          CATALOG_ROOT="${PWD}/branch" held/tools/aerieos-checkouts.sh "${AERIEOS_REF}" > "${RUNNER_TEMP}/releases"
          mapfile -t releases < "${RUNNER_TEMP}/releases"
          # ...and whose each entry is that the branch moved: nothing that
          # crosses owners is signed. Every pin, moved or not, is held to a
          # branch or a tag of the repository its entry names. No third
          # party's code runs in this job: the installs are the next one's.
          CATALOG_ROOT="${PWD}/branch" python3 -I held/tools/catalog-check.py "${releases[@]}" --whose-from origin/main --every-pin
  installs:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      # The commit the check answered for, as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: ${{ needs.check.outputs.commit }}
          fetch-depth: 0
          path: branch
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: main
          path: held
          persist-credentials: false
      - name: Each third party's pack the branch moved, installed by each release's own installer
        env:
          AERIEOS_REF: ${{ inputs.aerieos_ref }}
        run: |
          set -euo pipefail
          CATALOG_ROOT="${PWD}/branch" held/tools/aerieos-checkouts.sh "${AERIEOS_REF}" > "${RUNNER_TEMP}/releases"
          mapfile -t releases < "${RUNNER_TEMP}/releases"
          # With no network beyond the downloads a pack declares and no way
          # to root for any step of it; and nothing this job says reaches
          # the job that signs but whether it ended well.
          CATALOG_ROOT="${PWD}/branch" python3 -I held/tools/catalog-check.py "${releases[@]}" --whose-from origin/main --installs-only
  sign:
    needs: [check, installs]
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: write
    steps:
      # main's copy of the programs that sign, and the library they need,
      # before anything of the branch is here and before this job holds
      # anything it could lose.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: main
          path: held
          persist-credentials: false
      # The runner's own python, and main's list of the one library: each
      # file held to its sha256, wheels alone, in a step that holds no secret.
      - name: The signing library, pinned, from main's list
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --require-hashes --no-deps --only-binary :all: -r held/tools/sign-requirements.txt
      # The branch, as data, with the one credential this job has: the
      # token that commits the signed index to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          ref: ${{ needs.check.outputs.branch }}
          fetch-depth: 0
          path: branch
      - name: The branch has not moved since it was checked
        env:
          CHECKED: ${{ needs.check.outputs.commit }}
        run: |
          set -euo pipefail
          now="$(git -C branch rev-parse HEAD)"
          if [ "${now}" != "${CHECKED}" ]; then
            echo "the branch moved from ${CHECKED} to ${now} while it was being checked: nothing is signed, run this again"
            exit 1
          fi
      - name: Sign the index
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_SIGNING_KEY}" ]; then
            echo "the environment sign holds no secret CATALOG_SIGNING_KEY for this run: nothing is signed"
            exit 1
          fi
          python="${RUNNER_TEMP}/venv/bin/python"
          key="${RUNNER_TEMP}/catalog.key"
          # The secret is the key file's one line, or the hex alone, which is
          # what is left when only the second word was pasted.
          case "${CATALOG_SIGNING_KEY}" in
            builderbot-catalog-ed25519-private*) line="${CATALOG_SIGNING_KEY}" ;;
            *) line="builderbot-catalog-ed25519-private $(printf '%s' "${CATALOG_SIGNING_KEY}" | tr -d '[:space:]')" ;;
          esac
          ( umask 077; printf '%s\n' "${line}" > "${key}" )
          # Stamped with the moment and signed, by main's copy of the tool
          # and no other: an install orders two signed indexes by that date
          # and refuses the older.
          CATALOG_ROOT="${PWD}/branch" "${python}" -I held/tools/catalog-sign.py sign "${key}"
          rm -f "${key}"
          # The secret is the key main names, or nothing is kept.
          CATALOG_ROOT="${PWD}/branch" "${python}" -I held/tools/catalog-sign.py verify held/catalog.pub
      - name: Commit the stamped index and its signature to the branch
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
        working-directory: branch
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json index.sig; then
            echo "index.sig is already this index's signature"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.sig
          git commit -m "The index stamped and signed by the maintainers' key (the sign workflow, run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${BRANCH}"
